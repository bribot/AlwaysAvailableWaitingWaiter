<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Restaurant Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f6f7f8;
    --panel: #ffffff;
    --border: #dfe2e6;
    --text: #1c2126;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --good: #16a34a;
    --warn: #d97706;
    --bad: #dc2626;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { font-size: 16px; margin: 0; flex: 0 0 auto; }
  header .spacer { flex: 1; }
  header input[type=text] {
    width: 160px;
  }
  #status { font-size: 12px; color: var(--muted); }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; }
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }
  .panel.full { grid-column: 1 / -1; }
  .panel h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--muted);
    margin: 0 0 12px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover { background: #f0f4ff; }
  tr.selected { background: #e8f0fe; }
  button {
    font: inherit;
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
  }
  button:hover { background: #f2f3f5; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.primary:hover { filter: brightness(1.08); }
  button.danger { color: var(--bad); border-color: #f3c6c6; }
  button.danger:hover { background: #fdecec; }
  button.good { color: var(--good); border-color: #bfe3c9; }
  button.good:hover { background: #eafaf0; }
  button:disabled { opacity: .5; cursor: default; }
  input, select {
    font: inherit;
    font-size: 13px;
    padding: 5px 7px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    color: var(--text);
  }
  .row { display: flex; gap: 6px; align-items: center; }
  .muted { color: var(--muted); }
  .pill {
    display: inline-block;
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 999px;
    background: #eef1f4;
    color: var(--muted);
  }
  .pill.on { background: #e7f6ec; color: var(--good); }
  .empty { color: var(--muted); font-style: italic; padding: 8px 0; }
  #detailTitle { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
  #detailMeta { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  .section-title { font-size: 12px; font-weight: 600; color: var(--muted); margin: 16px 0 6px; text-transform: uppercase; letter-spacing: .04em; }
  .section-title:first-child { margin-top: 0; }
  .builder-row { display: grid; grid-template-columns: 1.4fr 60px 1.4fr 28px; gap: 6px; margin-bottom: 6px; }
  .toast {
    position: fixed;
    bottom: 16px;
    right: 16px;
    background: #1c2126;
    color: #fff;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    max-width: 340px;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .2s, transform .2s;
    pointer-events: none;
    z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { background: var(--bad); }
  code { font-family: var(--mono); background: #f0f1f3; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>

<header>
  <h1>Restaurant Admin</h1>
  <span id="status" class="muted">connecting…</span>
  <div class="spacer"></div>
  <label class="row muted" style="font-size:12px">
    API key
    <input id="apiKey" type="text" placeholder="(none)">
  </label>
  <button id="refreshAll">Refresh</button>
</header>

<main>

  <section class="panel">
    <h2>Devices</h2>
    <table id="deviceTable">
      <thead><tr><th>#</th><th>Table</th><th>Order</th><th>Items</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section class="panel">
    <h2>Tables</h2>
    <div class="row" style="margin-bottom:10px">
      <input id="jumpTable" type="text" placeholder="table #" style="width:80px">
      <button id="jumpBtn">Open</button>
    </div>
    <table id="tableTable">
      <thead><tr><th>#</th><th>Order</th><th>Current</th><th>Pending</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section class="panel full" id="detail" hidden>
    <p id="detailTitle"></p>
    <p id="detailMeta"></p>

    <div class="section-title">Current order</div>
    <table id="currentTable">
      <thead><tr><th>Item</th><th>Details</th><th>Price</th><th>Time</th><th>Delivered</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="row" style="margin-top:8px">
      <button id="clearTableBtn" class="danger">Clear table</button>
    </div>

    <div class="section-title">Pending order</div>
    <table id="pendingTable">
      <thead><tr><th>Item</th><th>Details</th><th>Price</th><th>Time</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="row" style="margin-top:8px">
      <button id="confirmBtn" class="good">Confirm pending</button>
      <button id="cancelPendingBtn" class="danger">Cancel pending</button>
    </div>

    <div class="section-title">Build an order</div>
    <div id="builderRows"></div>
    <div class="row" style="margin-top:6px">
      <button id="addRowBtn">+ Add item</button>
      <div class="spacer"></div>
      <button id="saveCurrentBtn" class="primary">Save as current order</button>
      <button id="savePendingBtn">Save as pending order</button>
    </div>
  </section>

</main>

<div id="toast" class="toast"></div>

<datalist id="menuList"></datalist>

<script>
const $ = (sel, el) => (el || document).querySelector(sel);
const $$ = (sel, el) => Array.from((el || document).querySelectorAll(sel));

const state = {
  apiKey: localStorage.getItem('adminApiKey') || '',
  currentTable: null,
  menu: [],
  ws: null,
  builderRows: [],
};

$('#apiKey').value = state.apiKey;
$('#apiKey').addEventListener('change', e => {
  state.apiKey = e.target.value.trim();
  localStorage.setItem('adminApiKey', state.apiKey);
});

function toast(message, isError) {
  const el = $('#toast');
  el.textContent = message;
  el.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 3500);
}

async function api(path, options) {
  const opts = Object.assign({}, options);
  opts.headers = Object.assign({}, opts.headers);
  if (state.apiKey) opts.headers['X-API-Key'] = state.apiKey;
  if (opts.body && !(opts.body instanceof FormData)) {
    opts.headers['Content-Type'] = 'application/json';
  }
  const res = await fetch(path, opts);
  if (res.status === 304) return null;
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch (e) {}
    throw new Error(`${res.status}: ${detail}`);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

function moneyFmt(n) { return '$' + Number(n).toFixed(2); }

// --------------------------------------------------------------- devices
async function loadDevices() {
  const devices = await api('/devices');
  const tbody = $('#deviceTable tbody');
  tbody.innerHTML = '';
  devices.forEach(d => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${d.device_number}</td>
      <td>${d.table_number}</td>
      <td>${d.order_id ?? '<span class="muted">—</span>'}</td>
      <td>${d.order.length}</td>
      <td></td>`;
    const btnCell = tr.lastElementChild;
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'new table #';
    input.style.width = '90px';
    const btn = document.createElement('button');
    btn.textContent = 'Assign';
    btn.onclick = async () => {
      const n = parseInt(input.value, 10);
      if (!n) return toast('enter a table number', true);
      try {
        await api(`/device/${d.device_number}`, { method: 'PUT', body: JSON.stringify({ table_number: n }) });
        toast(`device ${d.device_number} -> table ${n}`);
        input.value = '';
        loadDevices();
      } catch (e) { toast(e.message, true); }
    };
    btnCell.appendChild(input);
    btnCell.appendChild(btn);
    tr.querySelector('td').classList.add('clickable');
    tr.addEventListener('click', ev => {
      if (ev.target === input || ev.target === btn) return;
      selectTable(d.table_number);
    });
    tr.classList.add('clickable');
    tbody.appendChild(tr);
  });
}

// ---------------------------------------------------------------- tables
async function loadTables() {
  const tables = await api('/tables');
  const tbody = $('#tableTable tbody');
  tbody.innerHTML = '';
  if (!tables.length) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty">no tables yet — create one below or via the API</td></tr>';
    return;
  }
  tables.forEach(t => {
    const tr = document.createElement('tr');
    tr.className = 'clickable' + (t.table_number === state.currentTable ? ' selected' : '');
    tr.innerHTML = `
      <td>${t.table_number}</td>
      <td>${t.order_id ?? '<span class="muted">—</span>'}</td>
      <td>${t.item_count}</td>
      <td>${t.pending_count ? `<span class="pill on">${t.pending_count}</span>` : '<span class="muted">0</span>'}</td>`;
    tr.addEventListener('click', () => selectTable(t.table_number));
    tbody.appendChild(tr);
  });
}

// ----------------------------------------------------------------- menu
async function loadMenu() {
  state.menu = await api('/menu?include_unavailable=true');
  const list = $('#menuList');
  list.innerHTML = '';
  state.menu.forEach(item => {
    const opt = document.createElement('option');
    opt.value = item.id;
    opt.label = `${item.name} — ${moneyFmt(item.price)}${item.available ? '' : ' (unavailable)'}`;
    list.appendChild(opt);
  });
}

// --------------------------------------------------------------- detail
function renderDisplayRows(tbody, rows, withDelivered) {
  tbody.innerHTML = '';
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="${withDelivered ? 5 : 4}" class="empty">nothing here</td></tr>`;
    return;
  }
  rows.forEach((row, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${row.itemName}</td>
      <td class="muted">${row.details || ''}</td>
      <td>${moneyFmt(row.price)}</td>
      <td>${row.time} min</td>`;
    if (withDelivered) {
      const td = document.createElement('td');
      const btn = document.createElement('button');
      btn.textContent = row.delivered ? '✓ delivered' : 'mark delivered';
      btn.className = row.delivered ? 'good' : '';
      btn.onclick = async () => {
        try {
          await api(`/table/${state.currentTable}/${i}/delivered`, { method: 'POST' });
          refreshDetail();
        } catch (e) { toast(e.message, true); }
      };
      td.appendChild(btn);
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  });
}

async function selectTable(n) {
  state.currentTable = n;
  $('#detail').hidden = false;
  $('#detailTitle').textContent = `Table ${n}`;
  connectWs(n);
  await refreshDetail();
  loadTables();
}

async function refreshDetail() {
  if (state.currentTable == null) return;
  const n = state.currentTable;
  try {
    const [current, pending] = await Promise.all([
      api(`/table/${n}`),
      api(`/table/${n}/pending`),
    ]);
    renderDisplayRows($('#currentTable tbody'), current, true);
    renderDisplayRows($('#pendingTable tbody'), pending, false);
    const total = current.reduce((s, r) => s + r.price, 0);
    $('#detailMeta').textContent = `${current.length} item(s), ${moneyFmt(total)} — ${pending.length} pending`;
  } catch (e) {
    toast(e.message, true);
  }
}

function connectWs(n) {
  if (state.ws) { state.ws.close(); state.ws = null; }
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  let url = `${proto}//${location.host}/ws/tables/${n}`;
  if (state.apiKey) url += `?api_key=${encodeURIComponent(state.apiKey)}`;
  const ws = new WebSocket(url);
  ws.onmessage = ev => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    if (msg.type === 'ping') return;
    if (msg.type === 'order.updated' || msg.type === 'snapshot') {
      renderDisplayRows($('#currentTable tbody'), msg.display, true);
    } else if (msg.type === 'voice.pending' || msg.type === 'voice.cancelled') {
      toast(`table ${n}: "${msg.transcript || ''}"`);
      refreshDetail();
    }
    loadTables();
  };
  state.ws = ws;
}

// -------------------------------------------------------------- actions
$('#clearTableBtn').addEventListener('click', async () => {
  if (state.currentTable == null) return;
  if (!confirm(`Clear table ${state.currentTable}'s current order?`)) return;
  try {
    await api(`/table/${state.currentTable}/clearTable`, { method: 'POST' });
    toast('table cleared');
    refreshDetail();
  } catch (e) { toast(e.message, true); }
});

$('#confirmBtn').addEventListener('click', async () => {
  if (state.currentTable == null) return;
  try {
    await api(`/table/${state.currentTable}/confirm`, { method: 'POST' });
    toast('pending confirmed');
    refreshDetail();
  } catch (e) { toast(e.message, true); }
});

$('#cancelPendingBtn').addEventListener('click', async () => {
  if (state.currentTable == null) return;
  try {
    await api(`/table/${state.currentTable}/createPending`, { method: 'POST', body: JSON.stringify({ items: [] }) });
    toast('pending cleared');
    refreshDetail();
  } catch (e) { toast(e.message, true); }
});

$('#jumpBtn').addEventListener('click', () => {
  const n = parseInt($('#jumpTable').value, 10);
  if (!n) return toast('enter a table number', true);
  selectTable(n);
});
$('#jumpTable').addEventListener('keydown', e => { if (e.key === 'Enter') $('#jumpBtn').click(); });

$('#refreshAll').addEventListener('click', () => { loadDevices(); loadTables(); refreshDetail(); });

// ---------------------------------------------------------- order builder
function addBuilderRow() {
  const row = { menu_id: '', quantity: 1, modifiers: '' };
  state.builderRows.push(row);
  renderBuilder();
}

function renderBuilder() {
  const container = $('#builderRows');
  container.innerHTML = '';
  state.builderRows.forEach((row, i) => {
    const div = document.createElement('div');
    div.className = 'builder-row';
    div.innerHTML = `
      <input list="menuList" placeholder="menu id" value="${row.menu_id}">
      <input type="number" min="1" max="99" value="${row.quantity}">
      <input placeholder="modifiers, comma separated" value="${row.modifiers}">
      <button title="remove">×</button>`;
    const [menuInput, qtyInput, modInput, removeBtn] = div.children;
    menuInput.oninput = () => row.menu_id = menuInput.value.trim();
    qtyInput.oninput = () => row.quantity = parseInt(qtyInput.value, 10) || 1;
    modInput.oninput = () => row.modifiers = modInput.value;
    removeBtn.onclick = () => { state.builderRows.splice(i, 1); renderBuilder(); };
    container.appendChild(div);
  });
}

function builderPayload() {
  const items = state.builderRows
    .filter(r => r.menu_id)
    .map(r => ({
      menu_id: r.menu_id,
      quantity: r.quantity || 1,
      modifiers: r.modifiers.split(',').map(s => s.trim()).filter(Boolean),
    }));
  return { items };
}

$('#addRowBtn').addEventListener('click', addBuilderRow);

$('#saveCurrentBtn').addEventListener('click', async () => {
  if (state.currentTable == null) return toast('pick a table first', true);
  try {
    await api(`/table/${state.currentTable}/createOrder`, { method: 'POST', body: JSON.stringify(builderPayload()) });
    toast('current order saved');
    state.builderRows = [];
    renderBuilder();
    refreshDetail();
  } catch (e) { toast(e.message, true); }
});

$('#savePendingBtn').addEventListener('click', async () => {
  if (state.currentTable == null) return toast('pick a table first', true);
  try {
    await api(`/table/${state.currentTable}/createPending`, { method: 'POST', body: JSON.stringify(builderPayload()) });
    toast('pending order saved');
    state.builderRows = [];
    renderBuilder();
    refreshDetail();
  } catch (e) { toast(e.message, true); }
});

// ------------------------------------------------------------------ boot
async function boot() {
  try {
    await api('/health');
    $('#status').textContent = 'connected';
  } catch (e) {
    $('#status').textContent = 'cannot reach server';
    toast(e.message, true);
  }
  addBuilderRow();
  await Promise.all([loadDevices(), loadTables(), loadMenu()]);
  setInterval(() => { loadDevices(); loadTables(); }, 8000);
}

boot();
</script>
</body>
</html>
